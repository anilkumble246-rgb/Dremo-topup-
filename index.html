<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ 𝐃𝐫𝐞𝐦𝐨 𝐭𝐨𝐩𝐮𝐩 ⚡ - Game Top-up Center</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark-blue: #060c1c;
      --card-dark-blue: #0e1936;
      --card-border: #1a2d59;
      --primary-blue: #1877f2;
      --accent-gold: #ffb703;
      --text-white: #ffffff;
      --text-muted: #94a3b8;
      --input-bg: #081126;
      --radius: 14px;
      --bkash: #e2136e;
      --nagad: #f7921e;
      
      /* Admin Theme Colors */
      --admin-purple-bg: #130924;
      --admin-purple-card: #20103c;
      --admin-purple-border: #44247d;
      --admin-accent: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', 'Hind Siliguri', sans-serif; }
    
    body { 
      background-color: var(--bg-dark-blue); 
      color: var(--text-white); 
      min-height: 100vh;
    }
    
    /* Navbar */
    .navbar { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 0.9rem 5%; 
      background: #091329; 
      border-bottom: 1px solid var(--card-border); 
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4); 
      position: relative;
    }
    .logo { 
      font-size: 1.35rem; 
      font-weight: 700; 
      color: var(--text-white); 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      text-decoration: none;
    }
    .logo-img {
      height: 40px;
      width: 40px;
      object-fit: contain;
      border-radius: 8px;
    }
    .logo-text {
      color: var(--accent-gold);
      text-shadow: 0 0 10px rgba(255, 183, 3, 0.3);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .admin-btn {
      background: linear-gradient(135deg, #7e22ce, #9333ea);
      border: 1px solid #c084fc;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 6px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(168, 85, 247, 0); }
      100% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0); }
    }

    .menu-btn {
      background: rgba(24, 119, 242, 0.15);
      border: 1px solid var(--card-border);
      color: var(--accent-gold);
      font-size: 1.3rem;
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }
    .menu-btn:hover {
      background: rgba(24, 119, 242, 0.3);
    }

    /* Dropdown Menu */
    .dropdown-menu {
      display: none;
      position: absolute;
      top: 60px;
      right: 5%;
      background: #0e1936;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      width: 175px;
      overflow: hidden;
      z-index: 995;
    }
    .dropdown-menu.show {
      display: block;
    }
